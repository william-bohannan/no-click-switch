name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1). Created if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $version = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag version=$version"

      - name: Publish win-x64 (self-contained, multi-file)
        shell: pwsh
        run: |
          # Multi-file layout (not PublishSingleFile) reduces Defender ML false positives
          # on packed single-exe stubs that self-extract at runtime.
          $out = Join-Path $env:GITHUB_WORKSPACE "publish"
          dotnet publish NoClickSwitch.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:AssemblyVersion=${{ steps.meta.outputs.version }}.0 `
            -p:FileVersion=${{ steps.meta.outputs.version }}.0 `
            -p:InformationalVersion=${{ steps.meta.outputs.version }} `
            -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $out "NoClickSwitch.exe"))) { throw "publish missing NoClickSwitch.exe" }
          Get-ChildItem $out | Measure-Object | ForEach-Object { Write-Host "publish files: $($_.Count)" }

      - name: Zip package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "NoClickSwitch-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "publish\*") -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: No Click Switch ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: NoClickSwitch-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
